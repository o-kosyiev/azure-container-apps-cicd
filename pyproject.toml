[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "portfolio-api"
version = "1.0.0"
description = "Observable reference API for secure Azure Container Apps delivery"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Oleksii Kosyiev" }]
dependencies = [
  "fastapi==0.142.2",
  "prometheus-client==0.26.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["portfolio_api"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
