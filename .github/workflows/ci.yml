name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: src

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build, scan, and create SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock

      - name: Run application quality gates
        run: |
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
          python -m pip_audit --requirement requirements.lock --disable-pip

      - name: Lint Dockerfile with verified Hadolint binary
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -Eeuo pipefail
          hadolint_path="$RUNNER_TEMP/hadolint"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$hadolint_path" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          printf '%s  %s\n' "$HADOLINT_SHA256" "$hadolint_path" | sha256sum --check --status
          chmod 0755 "$hadolint_path"
          "$hadolint_path" Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: local/portfolio-api:${{ github.sha }}

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/portfolio-api:${{ github.sha }}
          format: table
          hide-progress: true
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/portfolio-api:${{ github.sha }}
          format: spdx-json
          output-file: portfolio-api.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: portfolio-api.spdx.json
          retention-days: 30

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
