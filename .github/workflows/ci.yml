name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build, scan, and create SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock

      - name: Run application quality gates
        run: |
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
          python -m pip_audit --requirement requirements.lock --disable-pip

      - name: Lint Dockerfile with verified Hadolint binary
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -Eeuo pipefail
          hadolint_path="$RUNNER_TEMP/hadolint"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$hadolint_path" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          printf '%s  %s\n' "$HADOLINT_SHA256" "$hadolint_path" | sha256sum --check --status
          chmod 0755 "$hadolint_path"
          "$hadolint_path" Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: local/portfolio-api:${{ github.sha }}

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/portfolio-api:${{ github.sha }}
          format: table
          hide-progress: true
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: local/portfolio-api:${{ github.sha }}
          format: spdx-json
          output-file: portfolio-api.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: portfolio-api.spdx.json
          retention-days: 30

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
