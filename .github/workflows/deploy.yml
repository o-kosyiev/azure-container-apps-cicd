name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options: [dev, stage, prod]
      canary_percent:
        description: Initial traffic percentage for the new revision
        required: true
        default: "10"
        type: choice
        options: ["5", "10", "20"]

permissions:
  contents: read

concurrency:
  group: container-app-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: portfolio-api
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      CANARY_PERCENT: ${{ inputs.canary_percent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to ACR
        id: registry
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -Eeuo pipefail
          az acr login --name "$ACR_NAME"
          login_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          echo "login-server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.registry.outputs.login-server }}/portfolio-api:${{ github.sha }}

      - name: Block vulnerable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.login-server }}/portfolio-api:${{ github.sha }}
          hide-progress: true
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push validated image and resolve digest
        id: image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          LOGIN_SERVER: ${{ steps.registry.outputs.login-server }}
        run: |
          set -Eeuo pipefail
          docker push "$LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          digest="$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            --query digest --output tsv)"
          echo "reference=$LOGIN_SERVER/$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.login-server }}/portfolio-api
          subject-digest: ${{ steps.image.outputs.digest }}

      - name: Deploy, verify, and promote canary
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -Eeuo pipefail
          trap './scripts/rollback.sh' ERR
          ./scripts/deploy-canary.sh "$IMAGE_REFERENCE"
          new_revision="$(az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query 'sort_by(@, &properties.createdTime)[-1].name' \
            --output tsv)"
          revision_fqdn="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$new_revision" \
            --query properties.fqdn --output tsv)"
          ./scripts/smoke-test.sh "https://$revision_fqdn"
          az containerapp ingress traffic set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision-weight "$new_revision=100" \
            --output none
          trap - ERR
